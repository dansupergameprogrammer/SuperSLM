[pytest]
# Default to the CI tier. tools/reference_pipeline/tests/ (T-2123/T-2137, vendored from the
# source spike's own tests/pytest.ini) carries `@pytest.mark.upstream` cells that need a real
# cached checkpoint and the transformers library -- real-weight cells that gate a release
# verification pass (design §5), not per-commit CI. `-m "not upstream"` deselects them by
# default; `-m "upstream or not upstream"` runs everything, including the real-weight tier,
# on a machine that has the checkpoint cached.
addopts = -m "not upstream"

markers =
    upstream: needs a real cached checkpoint and the transformers library. These are the
        real-weight cells: they gate a release verification pass (design §5's clean-checkout
        gate), not per-commit CI. Run CI with `-m "not upstream"`; a release verification
        pass must NOT deselect them.
