name: tests

on: [push, pull_request]

# T-2152 (outside strike item 8, release hardening): the default GITHUB_TOKEN this workflow
# would otherwise receive is read-write across the repository's own API surface (issues, PRs,
# packages, ...) -- none of the jobs below need anything beyond reading the checked-out source
# (every `uses: actions/checkout` here is a plain read; no job pushes a commit, opens a PR
# comment, or publishes a release). Declared once, top-level, so every job inherits read-only
# by default; a job that genuinely needs a broader scope in the future states it explicitly at
# that job's own `permissions:` block rather than silently inheriting the wide default.
permissions:
  contents: read

# S0 gate (SuperSLM_Plan.md §19): the loader coverage suite green on the full
# matrix. The determinism cross-device hash gate over the kernel path arrives with
# S2/S3; at S0 the matrix proves the artifact loader + format validation build and
# pass identically on every toolchain.
jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build
      - run: cmake --build build --config Release
      - shell: pwsh
        run: |
          $out = & build/Release/superslm_tests.exe
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { exit 1 }

  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ./build/superslm_tests

  linux-x64-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
      - run: cmake --build build
      - run: ./build/superslm_tests

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ./build/superslm_tests

  # Every job above builds Release/RelWithDebInfo, which all define NDEBUG and
  # compile out every assert()-based contract check in src/ -- including the
  # S2.5 death-test cell (tests/test_main.cpp) that proves a caller-contract
  # violation aborts a debug build. That claim was previously provable only on
  # a developer machine (build.bat, which does not define NDEBUG). This job
  # builds CMake's Debug configuration, which the generated project files
  # confirm never defines NDEBUG on any of MSVC/GCC/Clang, so the assert-live
  # branch of the death-test cell runs here and the same suite is proved
  # against it in CI.
  linux-x64-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build
      - run: ./build/superslm_tests

  # S-HARDEN-6 component 1 (F4, design Sec2.1, T-410): the ThreadSanitizer
  # leg. Ubuntu's default CMake compiler is GCC (none of the jobs above set
  # CC/CXX), so a plain `cmake -B build` never invokes Clang -- CC/CXX are
  # set to a pinned Clang major version explicitly (a floating `clang` would
  # conflate releases, Laplace finding 7/8). The two concurrent-read stress
  # harnesses already in tests/test_main.cpp
  # (TestSiluSigmoidQ15ConcurrentReadsMatchSingleThreaded,
  # TestGemmInt8AccumulateRowConcurrentReadsMatchSingleThreaded) name
  # themselves as waiting on exactly this leg ("the project's ThreadSanitizer
  # leg is the separate CI clang build, not this binary") -- no new test code
  # is needed, only the job that runs the existing binary under
  # -fsanitize=thread.
  linux-x64-tsan:
    runs-on: ubuntu-latest
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS="-fsanitize=thread"
      - run: cmake --build build --target superslm_tests
      - run: ./build/superslm_tests

  # T-2149 design §8.1, §11 step 7 (fold round 2 adds the SSE2 leg): the three forced
  # full-suite executables (design §11 step 5, CMakeLists.txt's SSE2/AVX2/AVX512 foreach
  # block, EXCLUDE_FROM_ALL) get the SAME 34000+-check suite superslm_tests already gets,
  # once per tier -- the existing suite becomes each tier's own dispatch-cache/bit-identity
  # proof for free, no new test code (design §8.1). x64-pinned (ubuntu-latest), Clang 18
  # (matching the local mutation-vitality proof already run against this exact toolchain --
  # the existing scalar-forced digest job's own stated reasoning, reused unchanged).
  linux-x64-clang-sse2-forced:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      - run: cmake --build build --target superslm_tests_sse2_forced
      - run: ./build/superslm_tests_sse2_forced

  # AVX2 is assumed present on any GH-hosted x86-64 runner (design §1) but the job still
  # defensively probes before running, so an unexpected absence reports SKIPPED rather than
  # crashing the job (design §8.1) -- this leg IS expected to always run in practice. The
  # probe reads a CPU flag from /proc/cpuinfo, never executes an AVX2 instruction itself, so
  # it is safe before AVX2 presence is confirmed.
  linux-x64-clang-avx2-forced:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      - run: cmake --build build --target superslm_tests_avx2_forced
      - name: Probe for AVX2 and run the forced suite if present
        run: |
          if grep -qw avx2 /proc/cpuinfo; then
            ./build/superslm_tests_avx2_forced
          else
            echo "AVX2-SKIPPED: runner lacks AVX2"
          fi

  # The AVX-512 leg runtime-probes hardware support before running (design §8.1/§8.3):
  # SIGILL is not a catchable, portable C++ exception, so the check happens using only
  # baseline (non-AVX-512) instructions before a single AVX-512 instruction executes.
  # SKIPPED is the expected, non-failing outcome on most GH-hosted runs (design §1's
  # grounded finding); RAN is informative whenever GitHub happens to schedule the job onto
  # AVX-512-capable hardware -- this is the CI half of design §8.4's must-fire gap, closed
  # for real only by the manual hardware run named at design §11 step 9 (D-SLM3511).
  linux-x64-clang-avx512-forced:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      - run: cmake --build build --target superslm_tests_avx512_forced
      - name: Probe for AVX-512F+BW and run the forced suite if present
        run: |
          if grep -qw avx512f /proc/cpuinfo && grep -qw avx512bw /proc/cpuinfo; then
            ./build/superslm_tests_avx512_forced
          else
            echo "AVX512-SKIPPED: runner lacks AVX-512F/BW"
          fi

  # S-HARDEN-6 components 2/3 (F4, design Sec2.1, T-410, T-180): the
  # cross-toolchain / cross-optimization digest-and-compare pattern Laplace
  # finding 2 names as entirely absent from CI ("no job compares its output
  # to any other job's"). Each job below builds tools/ci/sslm_axis_digest.cpp
  # (promoted from the disposable commission instrument) against a pinned
  # toolchain, runs it, and uploads its GLOBAL SHA-256 line. Every job also
  # fails locally if the harness's own scalar-vs-SIMD invariant check
  # reports a nonzero local_invariant_failures count, independent of what
  # axis-digest-compare finds afterward -- defense in depth, not a
  # substitute for the compare job (a single job's self-check cannot catch a
  # divergence BETWEEN jobs, which is the actual gap this component closes).
  #
  # Six jobs, not five: the four x64-toolchain-pair jobs (GCC/Clang x
  # Linux/Windows), the ratified macos-arm64-digest leg (Sec7.1, D-SLM170 --
  # not required by F4's text, ratified into this slot's scope), and the
  # SUPERSLM_FORCE_SCALAR_MATMUL leg (component 3, T-180) built from the
  # dedicated CMake target (sslm_axis_digest_scalar_forced). Comparing every
  # job's GLOBAL hash for equality covers all three axes (toolchain,
  # platform, SIMD-vs-scalar) in the one compare job below, since a correct
  # build produces the identical global digest regardless of which
  # conformant traversal order or code path computed it (design Sec4's
  # associativity argument) -- this is the direct CI expression of the
  # 54-axis-point local run (Claude/Laplace/sharden6-axis-harness) that
  # found them all equal.
  linux-x64-gcc-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
      - run: cmake --build build --target sslm_axis_digest
      - name: Run and extract the GLOBAL digest
        run: |
          ./build/sslm_axis_digest | tee axis_output.txt
          grep -q '^local_invariant_failures 0$' axis_output.txt
          mkdir -p artifact_out
          grep '^GLOBAL ' axis_output.txt > artifact_out/global_digest.txt
          echo RAN > artifact_out/status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: axis-digest-linux-x64-gcc
          path: artifact_out

  linux-x64-clang-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      - run: cmake --build build --target sslm_axis_digest
      - name: Run and extract the GLOBAL digest
        run: |
          ./build/sslm_axis_digest | tee axis_output.txt
          grep -q '^local_invariant_failures 0$' axis_output.txt
          mkdir -p artifact_out
          grep '^GLOBAL ' axis_output.txt > artifact_out/global_digest.txt
          echo RAN > artifact_out/status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: axis-digest-linux-x64-clang
          path: artifact_out

  windows-msvc-digest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build
      - run: cmake --build build --config Release --target sslm_axis_digest
      - name: Run and extract the GLOBAL digest
        shell: pwsh
        run: |
          $out = & build/Release/sslm_axis_digest.exe
          $out | Out-File -Encoding ascii axis_output.txt
          if (-not ($out -match '^local_invariant_failures 0$')) { throw "local invariant failure" }
          New-Item -ItemType Directory -Force -Path artifact_out | Out-Null
          ($out | Where-Object { $_ -match '^GLOBAL ' }) | Out-File -Encoding ascii artifact_out/global_digest.txt
          "RAN" | Out-File -Encoding ascii artifact_out/status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: axis-digest-windows-msvc
          path: artifact_out

  windows-clangcl-digest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build -T ClangCL
      - run: cmake --build build --config Release --target sslm_axis_digest
      - name: Run and extract the GLOBAL digest
        shell: pwsh
        run: |
          $out = & build/Release/sslm_axis_digest.exe
          $out | Out-File -Encoding ascii axis_output.txt
          if (-not ($out -match '^local_invariant_failures 0$')) { throw "local invariant failure" }
          New-Item -ItemType Directory -Force -Path artifact_out | Out-Null
          ($out | Where-Object { $_ -match '^GLOBAL ' }) | Out-File -Encoding ascii artifact_out/global_digest.txt
          "RAN" | Out-File -Encoding ascii artifact_out/status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: axis-digest-windows-clangcl
          path: artifact_out

  # Ratified into this slot's scope (Sec7.1, D-SLM170): the first executed
  # x64-vs-ARM comparison this plan's own text (SuperSLM_Plan.md:1436, T-182)
  # claims exists. GitHub-hosted `macos-latest` runners are Apple Silicon, so
  # this is the same digest-and-compare pattern as the four jobs above, no
  # new mechanism.
  macos-arm64-digest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target sslm_axis_digest
      - name: Run and extract the GLOBAL digest
        run: |
          ./build/sslm_axis_digest | tee axis_output.txt
          grep -q '^local_invariant_failures 0$' axis_output.txt
          mkdir -p artifact_out
          grep '^GLOBAL ' axis_output.txt > artifact_out/global_digest.txt
          echo RAN > artifact_out/status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: axis-digest-macos-arm64
          path: artifact_out

  # Component 3 (T-180): the scalar-forced axis, Clang/Linux (matches the
  # local mutation-vitality proof already run against this exact toolchain).
  linux-x64-clang-scalar-forced-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      - run: cmake --build build --target sslm_axis_digest_scalar_forced
      - name: Run and extract the GLOBAL digest
        run: |
          ./build/sslm_axis_digest_scalar_forced | tee axis_output.txt
          grep -q '^local_invariant_failures 0$' axis_output.txt
          mkdir -p artifact_out
          grep '^GLOBAL ' axis_output.txt > artifact_out/global_digest.txt
          echo RAN > artifact_out/status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: axis-digest-linux-x64-clang-scalar-forced
          path: artifact_out

  # T-2149 design §8.3, §11 step 7 (fold round 2, D-SLM3514): the SSE2-forced digest axis.
  # SSE2 is the guaranteed x86-64 architectural floor, so unlike the AVX2/AVX-512 legs below
  # there is no runner population on which this leg can lack its target instruction set --
  # runs unconditionally, no probe, no skip path, always uploads status RAN with a digest,
  # grouped with the seven other always-RAN legs above design §8.3 names.
  linux-x64-clang-sse2-forced-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      - run: cmake --build build --target sslm_axis_digest_sse2_forced
      - name: Run and extract the GLOBAL digest
        run: |
          ./build/sslm_axis_digest_sse2_forced | tee axis_output.txt
          grep -q '^local_invariant_failures 0$' axis_output.txt
          mkdir -p artifact_out
          grep '^GLOBAL ' axis_output.txt > artifact_out/global_digest.txt
          echo RAN > artifact_out/status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: axis-digest-linux-x64-clang-sse2-forced
          path: artifact_out

  # T-2149 design §8.3, §11 step 7: the AVX2-forced digest axis. AVX2 is assumed present on
  # any GH-hosted x86-64 runner (design §1) but is still defensively probed first, so an
  # unexpected absence reports SKIPPED (no digest uploaded, status SKIPPED) rather than
  # crashing the job -- this leg IS expected to always run in practice.
  linux-x64-clang-avx2-forced-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      - run: cmake --build build --target sslm_axis_digest_avx2_forced
      - name: Probe for AVX2, run and extract the GLOBAL digest if present
        run: |
          mkdir -p artifact_out
          if grep -qw avx2 /proc/cpuinfo; then
            ./build/sslm_axis_digest_avx2_forced | tee axis_output.txt
            grep -q '^local_invariant_failures 0$' axis_output.txt
            grep '^GLOBAL ' axis_output.txt > artifact_out/global_digest.txt
            echo RAN > artifact_out/status.txt
          else
            echo "AVX2-SKIPPED: runner lacks AVX2"
            echo "SKIPPED: runner lacks AVX2" > artifact_out/status.txt
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: axis-digest-linux-x64-clang-avx2-forced
          path: artifact_out

  # T-2149 design §8.3, §11 step 7: the AVX-512-forced digest axis. Probes AVX512F+BW (and,
  # per design §6.2's corrected gate, the same instruction population the runtime dispatch
  # probe checks) before running -- SKIPPED is the expected, non-failing outcome on most
  # GH-hosted runs (design §1), RAN is informative whenever GitHub happens to schedule the
  # job onto AVX-512-capable hardware. This is the digest half of design §8.4's must-fire
  # gap; the manual hardware run at design §11 step 9 (D-SLM3511) is what closes it for real.
  linux-x64-clang-avx512-forced-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      - run: cmake --build build --target sslm_axis_digest_avx512_forced
      - name: Probe for AVX-512F+BW, run and extract the GLOBAL digest if present
        run: |
          mkdir -p artifact_out
          if grep -qw avx512f /proc/cpuinfo && grep -qw avx512bw /proc/cpuinfo; then
            ./build/sslm_axis_digest_avx512_forced | tee axis_output.txt
            grep -q '^local_invariant_failures 0$' axis_output.txt
            grep '^GLOBAL ' axis_output.txt > artifact_out/global_digest.txt
            echo RAN > artifact_out/status.txt
          else
            echo "AVX512-SKIPPED: runner lacks AVX-512F/BW"
            echo "SKIPPED: runner lacks AVX-512F/BW" > artifact_out/status.txt
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: axis-digest-linux-x64-clang-avx512-forced
          path: artifact_out

  # The missing half Laplace finding 2 names: "no CI job compares its output
  # to any other job's." Downloads every digest artifact above and fails if
  # any two GLOBAL hashes differ -- covering the toolchain-pair axis
  # (GCC-vs-Clang, MSVC-vs-clang-cl), the platform axis (x64-vs-ARM, closing
  # T-182), and the SIMD-vs-scalar axis (component 3) in one comparison,
  # since a correct build's GLOBAL hash does not depend on which of these a
  # conformant build chose (design Sec4's associativity argument).
  #
  # T-2149 design §8.3, §11 step 7: extended with the status-file convention -- every leg
  # (RAN or SKIPPED) satisfies `needs` (a job that completes successfully either way), so a
  # SKIPPED leg never blocks this job from running. Every leg's own status.txt is read; RAN
  # legs' digests are compared for equality exactly as before, SKIPPED legs are reported by
  # name in the job summary rather than silently absent (design §8.3's own "absence is a
  # stated decision" discipline applied to a CI report). A build where the AVX-512 leg (and
  # only the AVX-512 leg) is SKIPPED is still green -- SSE2 and AVX2 are never both absent on
  # any GH-hosted x86-64 runner (design §1), so only the AVX-512 leg carries a designed skip
  # path; a SKIPPED SSE2 or AVX2 leg is unexpected and is reported the same as any other, but
  # does not by itself fail this job (the underlying full-suite/digest job for that leg is
  # what would have already failed if the runner genuinely lacked SSE2, which is architecturally
  # impossible on x86-64).
  axis-digest-compare:
    needs:
      - linux-x64-gcc-digest
      - linux-x64-clang-digest
      - windows-msvc-digest
      - windows-clangcl-digest
      - macos-arm64-digest
      - linux-x64-clang-scalar-forced-digest
      - linux-x64-clang-sse2-forced-digest
      - linux-x64-clang-avx2-forced-digest
      - linux-x64-clang-avx512-forced-digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: axis-digest-*
          path: digests
      - name: Compare every RAN leg's GLOBAL digest; report every SKIPPED leg by name
        run: |
          set -e
          status_files=$(find digests -name status.txt | sort)
          first=""
          skipped_count=0
          ran_count=0
          for s in $status_files; do
            leg_dir=$(dirname "$s")
            leg=$(basename "$leg_dir")
            status=$(tr -d '\r' < "$s")
            if [ "$status" = "RAN" ]; then
              ran_count=$((ran_count + 1))
              f="$leg_dir/global_digest.txt"
              if [ ! -f "$f" ]; then
                echo "MISSING DIGEST: $leg reports RAN but has no global_digest.txt"
                exit 1
              fi
              # Strip CR: the Windows axes write via Out-File (CRLF), the Linux/macOS
              # axes via grep>file (LF). A byte-identical digest then differs only by a
              # trailing \r and falsely trips the mismatch.
              hash=$(tr -d '\r' < "$f")
              echo "RAN     $leg: $hash"
              if [ -z "$first" ]; then
                first="$hash"
                first_leg="$leg"
              elif [ "$hash" != "$first" ]; then
                echo "MISMATCH: $leg ($hash) != $first_leg ($first)"
                exit 1
              fi
            else
              skipped_count=$((skipped_count + 1))
              echo "SKIPPED $leg: $status"
            fi
          done
          if [ -z "$first" ]; then
            echo "No leg reported RAN -- nothing to compare"
            exit 1
          fi
          echo "$ran_count leg(s) RAN and agree on $first; $skipped_count leg(s) SKIPPED (reported above)."

  # S-HARDEN-8 (F12, design Sec4.1, Sec4.3): source-only LLVM branch coverage
  # over src/ and include/superslm/ (tests/ and tools/ excluded from the
  # measured set), with per-file floors rather than one aggregate threshold
  # -- F12's own finding is that a single aggregate line percentage hides
  # exactly the parser gaps that matter (artifact.cpp and model.cpp were the
  # two files a 97%/92%/75.7% aggregate concealed real gaps inside). Floors
  # are measured, never invented -- tools/ci/check_branch_coverage_floors.py
  # fails the build if any file's measured branch percentage drops below its
  # pinned floor, once that floor exists. tools/ci/branch_coverage_floors.json
  # is committed: fourteen floors are pinned as of this commit -- thirteen
  # landed at 2809d73 (measured from this job's own artifact run 32113553479;
  # d73f131 removed src/matmul.cpp's then-entry, see the file's own
  # _measured_cell comment), and src/matmul.cpp's fourteenth landed from this
  # job's own run 32336576519 per the ruled record-then-commit sequence -- the design's own step 1, "the
  # first run of this gate records the actual per-file percentages", has
  # already happened. This leg always records its own measurement to a build
  # artifact via `--record-floors-to` (design Sec4.3 step 1); a human copies
  # the recorded value(s) into this committed file deliberately, and the
  # record step never writes the committed file itself (fold round 6,
  # D-SLM3603). The floors
  # are defined against THIS job's own clang-18 / Linux / RelWithDebInfo cell
  # (D-SLM521): only a branch-coverage percentage measured in that exact
  # configuration is a floor for it, so recording them requires a run of this
  # job specifically -- a number measured in any other cell (a different OS,
  # STL, or optimization level) would be an invented number wearing a
  # measurement's authority, which Sec5.4 prohibits regardless of which
  # machine measured it. A per-branch allowlist
  # (tools/ci/branch_coverage_allowlist.txt) exists for genuinely-unreachable
  # defensive code, each entry carrying its own reason.
  # RelWithDebInfo, not Release: assert()-gated contract checks stay live
  # (matching linux-x64-debug's own reasoning above), so their branches are
  # part of what this leg measures.
  # Pinned to Clang 18, not a fresh `apt-get install clang llvm`: Ubuntu's `llvm`
  # apt package installs its tools under version-suffixed names
  # (llvm-cov-18, llvm-profdata-18, ...) and does not reliably create
  # unversioned aliases, and a floating `clang`/`gcc` conflates releases across
  # runner-image updates regardless (the same reasoning as linux-x64-tsan and
  # the digest jobs above, Laplace findings 7/8). clang-18/clang++-18 are
  # already proven present on this exact runner image by those jobs -- no
  # apt-get step is needed here either.
  # T-2149 design §10 dimension 7 item (h) (fold round 4, D-SLM3569): src/matmul.cpp
  # widened from one SIMD kernel to three, so a single non-forced binary's runtime
  # dispatch selects exactly one tier per process -- the other two are structurally
  # dead there. This job now builds and runs the non-forced superslm_tests plus the
  # sse2/avx2/avx512-forced full-suite binaries and the scalar-forced digest, and
  # merges all five raw profiles before computing the branch percentage, so each SIMD
  # leaf reaches its own coverage in its own forced binary. (Fold round 6, D-SLM3605:
  # this paragraph previously continued with a stale description of a `|| true`
  # allowance and a partial-profile merge claim -- both predate the exit-status trap
  # below, which is this file's single, correct description of how the AVX-512-forced
  # binary's expected failure is handled.)
  branch-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Build with source-coverage instrumentation
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate"
          cmake --build build --target superslm_tests superslm_tests_sse2_forced \
            superslm_tests_avx2_forced superslm_tests_avx512_forced \
            sslm_axis_digest_scalar_forced
      # T-2149 design §10 dimension 7 item (h), fold round 5 (D-SLM3584): every
      # binary's exit status is trapped explicitly rather than relying on `bash -e`'s
      # implicit stop-on-error (which cannot distinguish which exit code killed the
      # job) or a blanket `|| true` (which swallowed a real regression identically to
      # the expected crash). The AVX-512-forced binary's expected-on-no-AVX-512-
      # hardware SIGILL (POSIX exit 132, design §8.4's own standing, disclosed gap)
      # is the only accepted non-zero exit, on any of the five binaries; the
      # AVX2-forced binary in particular previously ran with no fallback at all,
      # silently requiring an AVX2 runner with nothing stating the assumption.
      - name: Run the five binaries under instrumentation
        run: |
          set +e
          LLVM_PROFILE_FILE=build/nonforced.profraw ./build/superslm_tests
          ec_nonforced=$?
          LLVM_PROFILE_FILE=build/sse2.profraw ./build/superslm_tests_sse2_forced
          ec_sse2_forced=$?
          LLVM_PROFILE_FILE=build/avx2.profraw ./build/superslm_tests_avx2_forced
          ec_avx2_forced=$?
          LLVM_PROFILE_FILE=build/scalar_digest.profraw ./build/sslm_axis_digest_scalar_forced
          ec_scalar_digest=$?
          LLVM_PROFILE_FILE=build/avx512.profraw ./build/superslm_tests_avx512_forced
          ec_avx512_forced=$?
          set -e

          fail=0
          for entry in "superslm_tests:$ec_nonforced" \
                       "superslm_tests_sse2_forced:$ec_sse2_forced" \
                       "superslm_tests_avx2_forced:$ec_avx2_forced" \
                       "sslm_axis_digest_scalar_forced:$ec_scalar_digest"; do
            name="${entry%%:*}"
            ec="${entry##*:}"
            if [ "$ec" -ne 0 ]; then
              echo "::error::${name} exited ${ec} (any non-zero exit fails this leg)"
              fail=1
            fi
          done

          if [ "$ec_avx512_forced" -eq 132 ]; then
            echo "superslm_tests_avx512_forced: SIGILL (132), expected on a runner without AVX-512 hardware (design §8.4) -- not a failure"
          elif [ "$ec_avx512_forced" -ne 0 ]; then
            echo "::error::superslm_tests_avx512_forced exited ${ec_avx512_forced} (neither 0 nor the expected SIGILL/132) -- fails this leg"
            fail=1
          fi

          exit $fail
      - name: Merge the raw profiles
        run: |
          llvm-profdata-18 merge -sparse build/nonforced.profraw build/sse2.profraw \
            build/avx2.profraw build/scalar_digest.profraw build/avx512.profraw \
            -o build/superslm_tests.profdata
      - name: Export per-file branch coverage
        run: |
          llvm-cov-18 export --format=text \
            -instr-profile=build/superslm_tests.profdata \
            ./build/superslm_tests \
            -object ./build/superslm_tests_sse2_forced \
            -object ./build/superslm_tests_avx2_forced \
            -object ./build/superslm_tests_avx512_forced \
            -object ./build/sslm_axis_digest_scalar_forced \
            -- src/*.cpp include/superslm/*.h \
            > build/coverage.json
      # T-2149 design §10 dimension 7 item (h), fold round 6 (D-SLM3603): the record
      # step and the check step never share a file. The prior construction had the
      # record step conditionally rewrite the whole committed
      # tools/ci/branch_coverage_floors.json from THIS run's own measurement
      # whenever "src/matmul.cpp" was absent from it, then had the very next step
      # check that same file -- at HEAD, with no committed src/matmul.cpp entry,
      # every run took the record branch and the check step was checking the
      # record step's own output, reporting OK unconditionally regardless of the
      # true coverage. This step is now unconditional (cheap, and its output is
      # useful evidence even in the steady state) and writes only a build artifact,
      # never the committed file.
      #
      # Integration sequence: push (or PR) -> this leg runs, unconditionally
      # records its own measurement to the build artifact below, and -- because
      # tools/ci/branch_coverage_floors.json has no src/matmul.cpp key at HEAD --
      # the check step FAILS the leg with the named message -> a human downloads
      # the measured-branch-coverage-floors artifact and commits src/matmul.cpp's
      # measured value into tools/ci/branch_coverage_floors.json, next to that
      # file's own "_measured_cell" comment (already present, naming the cell:
      # GitHub-hosted Linux runner, clang-18, llvm-cov/llvm-profdata 18, the full
      # suite, all five binaries unioned) -> the next push finds the key present
      # and the leg goes green, unless a genuine regression occurred between the
      # two runs (in which case it correctly stays red, exactly as it would have
      # if the number had been correct from the start).
      - name: Record branch-coverage floors from this leg's own run
        run: |
          python3 tools/ci/check_branch_coverage_floors.py \
            --record-floors-to build/measured_branch_coverage_floors.json \
            build/coverage.json
      - name: Check per-file branch-coverage floors
        run: python3 tools/ci/check_branch_coverage_floors.py build/coverage.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: branch-coverage-json
          path: build/coverage.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: measured-branch-coverage-floors
          path: build/measured_branch_coverage_floors.json

  # The golden headers under tests/ and tools/ state, in their own generated
  # comments, that re-running their generator reproduces them byte-for-byte.
  # This job makes that claim structural rather than asserted: it regenerates
  # every generator that can run on a bare CI runner and fails if the working
  # tree changes, which also re-fires each generator's own guards (the ASCII
  # assertion, the pinned UTF-8 encoding, and the matmul golden's int32-escape
  # reconciliation) on every push and PR instead of only when a developer
  # happens to run the script locally.
  #
  # tests/gen_intmath_fixtures.py and tests/gen_matmul_fixtures.py import their
  # pinned reference from tests/reference/superslm_spike/, vendored in-repo at
  # a content-addressed revision (tests/reference/PROVENANCE.md) rather than
  # from a path outside this repository -- both now run on a bare checkout
  # with no access to any sibling repository (S-HARDEN-5, F3). The provenance
  # check runs first, so a tampered or stale vendor tree fails before either
  # regeneration step runs.
  #
  # tools/unicode_tables_golden.py (S-HARDEN-5, F8) is Unicode.build()'s first
  # committed golden: it asserts the pinned unicodedata version before any
  # table-building loop runs, then hashes the exact UNI1 blob bytes
  # convert_tokenizer.py embeds into every converted model. That assertion is
  # why this job's Python is pinned to the exact version below rather than a
  # floating one, the same reason converter-validate already pins it (T-406).
  generators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'
      - run: pip install numpy
      - run: python tests/reference/check_provenance.py
      # M1 fold (S-HARDEN-5): total AST ban on the `**` operator in the two
      # generators below, run BEFORE either regenerates -- `**` compiles to a
      # libm pow() call for a float operand, which is exactly what "no
      # sin/cos/log/exp/pow call executes on the regeneration path" must mean
      # if it is to be true (Claude/Vitruvius/SuperSLM_SHARDEN678_Bundle_
      # Design-2026-07-23.md Sec5).
      - run: python tests/check_no_pow_operator.py
      - run: python tests/gen_intmath_fixtures.py
      - run: python tests/gen_matmul_fixtures.py
      - run: python tools/gen_matmul_golden.py
      - run: python tools/gen_silu_lut_golden.py
      # Imports nothing outside the standard library, so it runs on a bare
      # checkout regardless of the reference-vendoring above. Resolves its
      # output path from __file__, so the cwd does not matter.
      - run: python tests/gen_iexp_domain_fixtures.py
      - run: python tools/unicode_tables_golden.py
      - name: Fail if regenerating changed any tracked file
        run: git diff --exit-code -- tests/sslm_intmath_fixtures.h tests/sslm_matmul_fixtures.h tests/matmul_golden_pin.h tests/silu_lut_golden_table.h include/superslm/silu_lut_canonical.h tests/sslm_iexp_domain_fixtures.h tools/unicode_tables_golden.txt

  # S-HARDEN-7 (F5, design Sec3.1, T-411): the "throws only std::bad_alloc"
  # contract's `membership-check` job. Mechanically, on every run: derives the
  # twenty-site population (T-1475: JsonEscape's promotion into
  # proof_manifest.h made it the 19th; T-2125: SslmAmplifyingFoldScaleView<Kind>::
  # Parse (model.h), the T-2021/T-2029 B0b runtime-additive-LoRA adapter view,
  # made it the 20th -- found unwrapped by this job, rename-and-wrap fixed in
  # the same change, model.h/model.cpp; design Sec3.1's table itself still
  # states eighteen and is owed a matching amendment) from the nine
  # include/superslm/*.h headers via a Clang AST walk
  # (tests/ci/derive_bad_alloc_membership.py's corrected, four-condition
  # rule), confirms it matches the pinned oracle
  # (tests/ci/bad_alloc_membership_expected.txt) under three independent scan
  # strategies and the injected-20th-function vitality proof
  # (tests/ci/test_membership_check_population.py), then runs the production
  # gate itself (tools/ci/check_bad_alloc_contract.py --list-unwrapped),
  # which fails naming any derived member whose .cpp definition does not
  # match the shared wrap-helper's rename-and-wrap shape. A Clang capable of
  # `-Xclang -ast-dump=json` ships pre-installed on GitHub's stock
  # `ubuntu-latest` runner image per its published software manifest
  # (design Sec3.1's independence note) -- not reconfirmed by executing a
  # runner in this design pass; this job's own first run is that
  # confirmation.
  bad-alloc-membership-check:
    runs-on: ubuntu-latest
    # Pinned to Clang 18 (matching linux-x64-tsan and the digest jobs above,
    # Laplace findings 7/8): tests/ci/derive_bad_alloc_membership.py invokes
    # `clang++ -Xclang -ast-dump=json` via the SUPERSLM_CLANGXX env var
    # (default bare "clang++" for local use); a floating `clang++` on this job
    # would conflate releases across runner-image updates the same as an
    # unpinned CC/CXX would.
    env:
      SUPERSLM_CLANGXX: clang++-18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'
      - run: pip install numpy pytest
      - name: Population-validation and vitality tests
        run: python -m pytest tests/ci/ -v
      - name: Fail on any unwrapped member of the derived population
        run: python tools/ci/check_bad_alloc_contract.py --list-unwrapped

  # SuperSLM_S3a_WalkingSkeleton_Plan.md Sec7.3 (T-200, Sec17.3 cell 5; ac34677
  # C1): the checked chain funnel's structural half -- no translation unit in
  # the forward composition may name a funnel leaf (MaxAbsReduce,
  # MaxAbsReduceWide, RowBoundsWide, NormalizeScale, DynamicScaleReciprocal,
  # RequantTokenCode, RequantTokenCodeWide, NarrowAccumulatorToI32) directly,
  # outside the funnel's own file and the leaf certification TUs. Mirrors the
  # two precedents already CI-wired (tests/check_no_pow_operator.py above,
  # tools/ci/check_bad_alloc_contract.py's own job): a test step, then the
  # gate's own explicit `- run:` step. Independent of the bad-alloc-membership-
  # check job above (which also collects tests/ci/ via pytest) so this gate's
  # own pass/fail does not depend on that job's environment or ordering.
  forward-leaf-check:
    runs-on: ubuntu-latest
    # T-1381 (D-SLM464; SuperSLM_S3a_WalkingSkeleton_Plan.md Sec7.3a): the
    # door-count guard (find_leaf_forwarding_doors/check_door_count) is now a
    # Clang-AST derivation over the funnel's one file, replacing the text
    # scanner a second hardened repair still left with three missed shapes.
    # Pinned to Clang 18, matching bad-alloc-membership-check's own job's
    # pin -- a floating `clang++` on this job would conflate releases across
    # runner-image updates the same as an unpinned CC/CXX would. (Corrected
    # 2026-07-31, Poirot 5eff945-t1380-t1381-t1382-review-2026-07-31.md,
    # Minor 3: this comment previously said the sibling job's pin "already
    # proves clang++-18 is present on this exact ubuntu-latest runner image"
    # -- false on two counts. First, that job's own comment above states the
    # opposite: the binary's presence is taken from the published software
    # manifest, "not reconfirmed by executing a runner in this design pass."
    # Second, this job -- added after the last successful run -- has never
    # started on this repository (`gh run view`, executed; T-1450 corrects
    # D-SLM469's broader claim: 77 runs total, 44 successful, last success
    # 2026-07-23T19:03:55Z on 4071828 -- every job added after that commit,
    # this one included, has never started; every push since aborts on the
    # account's Actions spending limit). The underlying fact (clang++-18
    # ships on this runner image per its manifest) is still the true basis
    # for the pin; what was false is the claim that a run had confirmed it.
    # This job's own first successful run is that confirmation, exactly as
    # bad-alloc-membership-check's own comment already states for itself.)
    # The whole-tree leaf ban (scan_files) needs no compiler at all and is
    # unaffected.
    env:
      SUPERSLM_CLANGXX: clang++-18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'
      - run: pip install pytest
      - name: Forward-leaf check's own red suite
        run: python -m pytest tests/ci/test_check_no_forward_leaf_calls.py -v
      - name: Fail the build if a forward TU names a funnel leaf directly
        run: python tests/ci/check_no_forward_leaf_calls.py

  # SuperSLM_S3a_WalkingSkeleton_Plan.md Sec11 intro, Sec14.12 (D-SLM411, D-SLM414,
  # D-SLM418; board T-1337): a test-suite comment that cites a review-severity
  # finding (Critical N / Significant N / Weak N / Structural N) must also show a
  # resolution marker ("closed", or a cited ticket ID) in the same comment block --
  # the class that recurred seven times across three review rounds before this
  # check existed. Mirrors forward-leaf-check's own two-step shape (self-test,
  # then the gate script), and is now wired to fail the build (T-1485).
  # Blocking since (Claude/Brunel/ build log for T-1485): a fresh run of this
  # check against real HEAD -- derived by executing the check, not enumerated
  # by hand -- surfaced sixteen flagged blocks. One was a genuine checker
  # defect: `_iter_blocks` scanned a multi-line Python triple-quoted docstring
  # only by its opening physical line, hiding a resolution marker that in
  # fact appeared later in the same docstring; fixed with triple-quote
  # tracking and its own regression cells (a second, related defect --
  # a fixture-generator script's list-of-strings convention merging an
  # embedded `//` comment run into unrelated surrounding code -- was found
  # and fixed the same way, though it did not change that block's flagged
  # disposition). The remaining fifteen were true positives: a citation
  # resolved elsewhere in the same file (a sibling comment block, a
  # crash-probe printf, a CHECK_MSG string, or a navigational section header)
  # but not self-contained in its own scanned block. Each got its own
  # resolution marker. The check is green on a full run
  # (`python tests/ci/check_present_tense_defect_comments.py`) as of the
  # commit that removed `continue-on-error` below.
  present-tense-defect-comment-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'
      - run: pip install pytest
      - name: Present-tense-defect-comment check's own red suite and historical-population validation
        run: python -m pytest tests/ci/test_check_present_tense_defect_comments.py -v
      - name: Fail the build if a test-suite comment cites a severity finding with no resolution marker
        run: python tests/ci/check_present_tense_defect_comments.py

  # T-2055 (Claude/Poirot/db73b22-gpu-serial-port-final-confirmation-review.md,
  # P1): the GPU-serial port's own "the guard-count class is closed" claim
  # (gpu_layer_loop_guards.def, gpu_port.h, superslm_gpu.cpp) was, four
  # records running, restating a hand-written mirror of forward_sites.cpp
  # rather than checking against it -- falsified by execution (a tenth guard
  # added to both RunLayerLoopImpl and RunLayerLoopGpu, no matching .def row,
  # left the build green and the suite unchanged). This job's check reads
  # forward_sites.cpp itself and fails the build the moment its own derived
  # guard-status set stops agreeing with the GPU ladder's or the .def's own.
  # Mirrors forward-leaf-check's own two-step shape (self-test, then the gate
  # script) exactly; no compiler dependency (unlike forward-leaf-check's
  # clang++ AST walk), so no pinned-toolchain env var is needed here.
  gpu-guard-status-parity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'
      - run: pip install pytest
      - name: GPU guard-status-parity check's own red suite (mechanism + the review's own three mutations)
        run: python -m pytest tests/ci/test_check_gpu_guard_status_parity.py -v
      - name: Fail the build if CPU's guard range, the GPU ladder, and gpu_layer_loop_guards.def disagree
        run: python tests/ci/check_gpu_guard_status_parity.py

  # S-HARDEN-3 (F13): the converter's validate/serialize/verify transaction and
  # its proof manifest. Builds `sslm_verify` (the §13 item 7 independent C++
  # verifier) so tools/test_sslm_convert_loader_join.py (§17.3 cell 2) and
  # tools/test_pinned_calibration_gate.py (the "small pinned calibrated
  # fixture" gate) can invoke the REAL compiled binary, not a stand-in --
  # every other module under tools/ is import-independent of the cross-tree
  # spike (see sslm_convert_validate.py's own module docstring) and runs on
  # this bare checkout with no calibrated checkpoint.
  converter-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      # Pinned to 3.13, not the floating '3.x' every other job uses: CPython's
      # bundled unicodedata.unidata_version tracks the minor version
      # (confirmed by inspection: 3.9 -> 13.0.0, 3.11 -> 14.0.0, 3.13 -> 15.1.0),
      # and tools/sslm_convert_validate.py's check_unicode_version_coherence
      # rejects the converter's CFG1 pin (PINNED_UNICODE_VERSION = (15, 1, 0),
      # matching tools/convert_model.py's and tools/unicode_tables.py's own
      # pin) unless the running interpreter's unicodedata agrees exactly. A
      # floating '3.x' resolves to whatever is newest on the runner, which
      # drifted to a Python whose unicodedata is 16.0.0 and failed the gate
      # (UnicodeVersionMismatch) even though the converter's rejection was
      # correct behavior, not a converter defect.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'
      # T-2137 (Poirot casebook f83afe0-t2137-vendoring-review.md, C1): this job now collects
      # tools/test_calibrate_checkpoint.py, tools/test_reference_pipeline_b1a_reproducibility.py,
      # and tools/test_reference_pipeline_b1b_composition_cell.py (none carries
      # @pytest.mark.upstream, so none is deselected), which reach tokenizers directly
      # (tools/_calibrate_checkpoint_fixture.py) and transformers via
      # reference_pipeline.pipeline.load_model -- both declared in requirements.txt.
      - run: pip install -r requirements.txt
      # T-407: assert the Python<->Unicode coupling the comment above only documents, at setup,
      # so a runner drift fails loud HERE instead of deep inside the pytest run as an opaque
      # UnicodeVersionMismatch. Compares the running interpreter against the single pinned source
      # of truth (PINNED_UNICODE_VERSION), never a second copy of the version literal.
      - name: Assert running unicodedata matches PINNED_UNICODE_VERSION
        run: |
          python -c "import sys; sys.path.insert(0, 'tools'); import unicodedata; from sslm_convert_validate import PINNED_UNICODE_VERSION as P; a = tuple(int(x) for x in unicodedata.unidata_version.split('.')); assert a == P, f'unicodedata {a} != pinned {P}'"
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --target sslm_verify
      # tests/reference/ added for S-HARDEN-5: its guard-vitality suite
      # (tests/reference/test_check_provenance.py) proves check_provenance.py
      # actually rejects a tampered vendored file, not merely that a clean
      # tree passes. Import-independent of the cross-tree spike, same as
      # everything else this job already runs.
      - run: python -m pytest tools/ tests/reference/ -v

  # T-2149 design §10 dimension 7 item (d), fold round 6 (D-SLM3604, Poirot
  # T-2174 Critical 2): check_matmul_avx_isolation and its population
  # self-test (check_matmul_avx_isolation_population_vitality) are `ctest`
  # entries (CMakeLists.txt) and no job in this workflow invoked `ctest` --
  # CMakeLists.txt's own prior comment claiming the checker "Runs today,
  # unconditionally" was false. This job wires exactly those two entries by
  # name prefix; neither needs the project built (both invoke python3
  # directly, with no binary dependency), so configuration is a bare
  # `cmake -B build` with no build step. `-R '^check_matmul_avx_isolation'`
  # matches both `check_matmul_avx_isolation` and
  # `check_matmul_avx_isolation_population_vitality` and excludes every
  # other `add_test` entry in CMakeLists.txt (superslm_tests,
  # t2139_gate_*/t2141_gate_*) -- a deliberate scope decision, named here
  # rather than silently touched or silently left unwired.
  matmul-avx-isolation-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'
      # check_matmul_avx_isolation_population_vitality invokes `python3 -m
      # pytest` (CMakeLists.txt) -- pytest is required on the interpreter
      # CMake's find_package(Python3) resolves, matching the
      # bad-alloc-membership-check job's own setup-python + pip install
      # pattern for the same reason.
      - run: pip install pytest
      # T-2179 fix round 5 (Finding 1): SUPERSLM_REQUIRE_CI_CHECK_TOOLS=ON makes a
      # missing Python 3 interpreter a hard configure failure here -- the one job
      # these two ctest entries actually gate. The option defaults OFF everywhere
      # else, so a bare `cmake -B build` on a Python-less host configures clean.
      - run: cmake -B build -DSUPERSLM_REQUIRE_CI_CHECK_TOOLS=ON
      # T-2177 Finding 2: `-R` alone selects tests by name and exits 0 when the
      # selection is empty ("No tests were found!!!") -- a filter typo or a
      # registration that silently stopped happening (e.g. the else() branch
      # this repository's own CMakeLists.txt used to take on a missing Python3
      # interpreter) would make this job report success having run nothing.
      # --no-tests=error turns an empty selection into a hard failure (exit 8).
      - run: ctest --test-dir build --output-on-failure --no-tests=error -R '^check_matmul_avx_isolation'

  # T-2177 Finding 5: the branch-coverage job's own comment (above) claimed
  # tools/ci/branch_coverage_floors.json was not yet committed and that job
  # had never started -- both false, and false in the repository's own
  # history, in the paragraph a prior fix round edited without reading it.
  # Rewriting the paragraph more carefully has now failed three consecutive
  # rounds; this pins the mechanism instead, per the reviewer's own routed
  # repair -- a cell that fails the moment either claim becomes true again,
  # rather than a fourth attempt at wording.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: branch_coverage_floors.json is committed and pins exactly fourteen numeric floors
        run: |
          python3 -c "
          import json
          with open('tools/ci/branch_coverage_floors.json') as f:
              floors = json.load(f)
          numeric = [k for k in floors if not k.startswith('_')]
          assert len(numeric) == 14, (
              'tests.yml\'s branch-coverage comment states the pinned-floor count; '
              'update both together (measured: {})'.format(len(numeric))
          )
          print('{} floor(s) pinned'.format(len(numeric)))
          "
      # T-2177 Finding 5's own reasoning applies recursively: a check written
      # as a shell `grep` for the literal retired phrase would match its OWN
      # quoted argument in this same file. The retired phrases are built by
      # runtime string concatenation instead, so neither is present as a
      # contiguous literal anywhere in this source file -- only the parsed
      # tests.yml content this step reads is searched for the whole phrase.
      - name: tests.yml never claims the floors file is uncommitted or the job unstarted
        run: |
          python3 -c "
          retired_1 = 'is NOT' + ' YET committed'
          retired_2 = 'this job has ' + 'never started'
          with open('.github/workflows/tests.yml') as f:
              text = f.read()
          assert retired_1 not in text, (
              'tests.yml claims tools/ci/branch_coverage_floors.json is '
              + retired_1 + ', but it is committed with pinned floors (commit 2809d73)'
          )
          assert retired_2 not in text, (
              'tests.yml claims the branch-coverage job has never started, but '
              'its own committed floors file was measured from a real run of it'
          )
          "

  # T-2196 S1/S2 (Claude/Poirot/8bf85c5-t2196-t2189-final-confirmation.md):
  # the T-2195 remedy above lived as an inline `python3 -c "..."` block, reachable only
  # on this hosted runner, with no self-test -- unlike every sibling structural checker
  # in tests/ci/. It also did not fire on the instance it was built for: the clause
  # splitter cut a filename's and a link target's own periods as sentence boundaries,
  # shredding the one sentence it needed to catch into fragments that carried the CI
  # noun and the execution verb separately. tests/ci/check_ci_claims.py replaces it,
  # matching tests/ci/check_present_tense_defect_comments.py's own two-step shape
  # (self-test, then the gate script), runnable by `pytest tests/ci/` on any machine --
  # not only a hosted runner that, per docs/platform-support.md's own CI execution
  # status section, has not executed since 2026-07-23.
  ci-claims-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'
      - run: pip install pytest
      - name: CI-execution-claim check's own red suite and historical-population validation
        run: python -m pytest tests/ci/test_check_ci_claims.py -v
      - name: Fail the build if a public doc restates a present-tense CI-execution claim outside platform-support.md's CI execution status section
        run: python tests/ci/check_ci_claims.py
