name: tests

on: [push, pull_request]

# S0 gate (SuperSLM_Plan.md §19): the loader coverage suite green on the full
# matrix. The determinism cross-device hash gate over the kernel path arrives with
# S2/S3; at S0 the matrix proves the artifact loader + format validation build and
# pass identically on every toolchain.
jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build
      - run: cmake --build build --config Release
      - shell: pwsh
        run: |
          $out = & build/Release/superslm_tests.exe
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { exit 1 }

  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ./build/superslm_tests

  linux-x64-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
      - run: cmake --build build
      - run: ./build/superslm_tests

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ./build/superslm_tests

  # Every job above builds Release/RelWithDebInfo, which all define NDEBUG and
  # compile out every assert()-based contract check in src/ -- including the
  # S2.5 death-test cell (tests/test_main.cpp) that proves a caller-contract
  # violation aborts a debug build. That claim was previously provable only on
  # a developer machine (build.bat, which does not define NDEBUG). This job
  # builds CMake's Debug configuration, which the generated project files
  # confirm never defines NDEBUG on any of MSVC/GCC/Clang, so the assert-live
  # branch of the death-test cell runs here and the same suite is proved
  # against it in CI.
  linux-x64-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build
      - run: ./build/superslm_tests

  # S-HARDEN-6 component 1 (F4, design Sec2.1, T-410): the ThreadSanitizer
  # leg. Ubuntu's default CMake compiler is GCC (none of the jobs above set
  # CC/CXX), so a plain `cmake -B build` never invokes Clang -- CC/CXX are
  # set to a pinned Clang major version explicitly (a floating `clang` would
  # conflate releases, Laplace finding 7/8). The two concurrent-read stress
  # harnesses already in tests/test_main.cpp
  # (TestSiluSigmoidQ15ConcurrentReadsMatchSingleThreaded,
  # TestGemmInt8AccumulateRowConcurrentReadsMatchSingleThreaded) name
  # themselves as waiting on exactly this leg ("the project's ThreadSanitizer
  # leg is the separate CI clang build, not this binary") -- no new test code
  # is needed, only the job that runs the existing binary under
  # -fsanitize=thread.
  linux-x64-tsan:
    runs-on: ubuntu-latest
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS="-fsanitize=thread"
      - run: cmake --build build --target superslm_tests
      - run: ./build/superslm_tests

  # S-HARDEN-6 components 2/3 (F4, design Sec2.1, T-410, T-180): the
  # cross-toolchain / cross-optimization digest-and-compare pattern Laplace
  # finding 2 names as entirely absent from CI ("no job compares its output
  # to any other job's"). Each job below builds tools/ci/sslm_axis_digest.cpp
  # (promoted from the disposable commission instrument) against a pinned
  # toolchain, runs it, and uploads its GLOBAL SHA-256 line. Every job also
  # fails locally if the harness's own scalar-vs-SIMD invariant check
  # reports a nonzero local_invariant_failures count, independent of what
  # axis-digest-compare finds afterward -- defense in depth, not a
  # substitute for the compare job (a single job's self-check cannot catch a
  # divergence BETWEEN jobs, which is the actual gap this component closes).
  #
  # Six jobs, not five: the four x64-toolchain-pair jobs (GCC/Clang x
  # Linux/Windows), the ratified macos-arm64-digest leg (Sec7.1, D-SLM170 --
  # not required by F4's text, ratified into this slot's scope), and the
  # SUPERSLM_FORCE_SCALAR_MATMUL leg (component 3, T-180) built from the
  # dedicated CMake target (sslm_axis_digest_scalar_forced). Comparing every
  # job's GLOBAL hash for equality covers all three axes (toolchain,
  # platform, SIMD-vs-scalar) in the one compare job below, since a correct
  # build produces the identical global digest regardless of which
  # conformant traversal order or code path computed it (design Sec4's
  # associativity argument) -- this is the direct CI expression of the
  # 54-axis-point local run (Claude/Laplace/sharden6-axis-harness) that
  # found them all equal.
  linux-x64-gcc-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
      - run: cmake --build build --target sslm_axis_digest
      - name: Run and extract the GLOBAL digest
        run: |
          ./build/sslm_axis_digest | tee axis_output.txt
          grep -q '^local_invariant_failures 0$' axis_output.txt
          grep '^GLOBAL ' axis_output.txt > global_digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: axis-digest-linux-x64-gcc
          path: global_digest.txt

  linux-x64-clang-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      - run: cmake --build build --target sslm_axis_digest
      - name: Run and extract the GLOBAL digest
        run: |
          ./build/sslm_axis_digest | tee axis_output.txt
          grep -q '^local_invariant_failures 0$' axis_output.txt
          grep '^GLOBAL ' axis_output.txt > global_digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: axis-digest-linux-x64-clang
          path: global_digest.txt

  windows-msvc-digest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build
      - run: cmake --build build --config Release --target sslm_axis_digest
      - name: Run and extract the GLOBAL digest
        shell: pwsh
        run: |
          $out = & build/Release/sslm_axis_digest.exe
          $out | Out-File -Encoding ascii axis_output.txt
          if (-not ($out -match '^local_invariant_failures 0$')) { throw "local invariant failure" }
          ($out | Where-Object { $_ -match '^GLOBAL ' }) | Out-File -Encoding ascii global_digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: axis-digest-windows-msvc
          path: global_digest.txt

  windows-clangcl-digest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build -T ClangCL
      - run: cmake --build build --config Release --target sslm_axis_digest
      - name: Run and extract the GLOBAL digest
        shell: pwsh
        run: |
          $out = & build/Release/sslm_axis_digest.exe
          $out | Out-File -Encoding ascii axis_output.txt
          if (-not ($out -match '^local_invariant_failures 0$')) { throw "local invariant failure" }
          ($out | Where-Object { $_ -match '^GLOBAL ' }) | Out-File -Encoding ascii global_digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: axis-digest-windows-clangcl
          path: global_digest.txt

  # Ratified into this slot's scope (Sec7.1, D-SLM170): the first executed
  # x64-vs-ARM comparison this plan's own text (SuperSLM_Plan.md:1436, T-182)
  # claims exists. GitHub-hosted `macos-latest` runners are Apple Silicon, so
  # this is the same digest-and-compare pattern as the four jobs above, no
  # new mechanism.
  macos-arm64-digest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target sslm_axis_digest
      - name: Run and extract the GLOBAL digest
        run: |
          ./build/sslm_axis_digest | tee axis_output.txt
          grep -q '^local_invariant_failures 0$' axis_output.txt
          grep '^GLOBAL ' axis_output.txt > global_digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: axis-digest-macos-arm64
          path: global_digest.txt

  # Component 3 (T-180): the scalar-forced axis, Clang/Linux (matches the
  # local mutation-vitality proof already run against this exact toolchain).
  linux-x64-clang-scalar-forced-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
      - run: cmake --build build --target sslm_axis_digest_scalar_forced
      - name: Run and extract the GLOBAL digest
        run: |
          ./build/sslm_axis_digest_scalar_forced | tee axis_output.txt
          grep -q '^local_invariant_failures 0$' axis_output.txt
          grep '^GLOBAL ' axis_output.txt > global_digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: axis-digest-linux-x64-clang-scalar-forced
          path: global_digest.txt

  # The missing half Laplace finding 2 names: "no CI job compares its output
  # to any other job's." Downloads every digest artifact above and fails if
  # any two GLOBAL hashes differ -- covering the toolchain-pair axis
  # (GCC-vs-Clang, MSVC-vs-clang-cl), the platform axis (x64-vs-ARM, closing
  # T-182), and the SIMD-vs-scalar axis (component 3) in one comparison,
  # since a correct build's GLOBAL hash does not depend on which of these a
  # conformant build chose (design Sec4's associativity argument).
  axis-digest-compare:
    needs:
      - linux-x64-gcc-digest
      - linux-x64-clang-digest
      - windows-msvc-digest
      - windows-clangcl-digest
      - macos-arm64-digest
      - linux-x64-clang-scalar-forced-digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: axis-digest-*
          path: digests
      - name: Compare every axis's GLOBAL digest
        run: |
          set -e
          files=$(find digests -name global_digest.txt | sort)
          echo "Comparing:"; cat $files
          first=""
          for f in $files; do
            # Strip CR: the Windows axis writes its digest via Out-File (CRLF),
            # the Linux axes via grep>file (LF). A byte-identical digest then
            # differs only by a trailing \r and falsely trips the mismatch.
            hash=$(tr -d '\r' < "$f")
            if [ -z "$first" ]; then
              first="$hash"
              first_file="$f"
            elif [ "$hash" != "$first" ]; then
              echo "MISMATCH: $f ($hash) != $first_file ($first)"
              exit 1
            fi
          done
          echo "All $(echo "$files" | wc -l) axis digests agree: $first"

  # S-HARDEN-8 (F12, design Sec4.1, Sec4.3): source-only LLVM branch coverage
  # over src/ and include/superslm/ (tests/ and tools/ excluded from the
  # measured set), with per-file floors rather than one aggregate threshold
  # -- F12's own finding is that a single aggregate line percentage hides
  # exactly the parser gaps that matter (artifact.cpp and model.cpp were the
  # two files a 97%/92%/75.7% aggregate concealed real gaps inside). Floors
  # are measured, never invented -- tools/ci/check_branch_coverage_floors.py
  # fails the build if any file's measured branch percentage drops below its
  # pinned floor, once that floor exists. tools/ci/branch_coverage_floors.json
  # is NOT YET committed (T-1451, correcting this comment's prior false claim
  # that it was): this job has never started (D-SLM469/T-1450), so the design's
  # own step 1 -- "the first run of this gate records the actual per-file
  # percentages" -- has never happened. Until it does, the checker fails
  # cleanly with a diagnostic naming the missing file and the `--record-floors`
  # remedy (design Sec4.3 step 1) rather than crashing; that failure is this
  # job's honest, expected first result, not a defect in the gate. The floors
  # are defined against THIS job's own clang-18 / Linux / RelWithDebInfo cell
  # (D-SLM521): only a branch-coverage percentage measured in that exact
  # configuration is a floor for it, so recording them requires a run of this
  # job specifically -- a number measured in any other cell (a different OS,
  # STL, or optimization level) would be an invented number wearing a
  # measurement's authority, which Sec5.4 prohibits regardless of which
  # machine measured it. A per-branch allowlist
  # (tools/ci/branch_coverage_allowlist.txt) exists for genuinely-unreachable
  # defensive code, each entry carrying its own reason.
  # RelWithDebInfo, not Release: assert()-gated contract checks stay live
  # (matching linux-x64-debug's own reasoning above), so their branches are
  # part of what this leg measures.
  # Pinned to Clang 18, not a fresh `apt-get install clang llvm`: Ubuntu's `llvm`
  # apt package installs its tools under version-suffixed names
  # (llvm-cov-18, llvm-profdata-18, ...) and does not reliably create
  # unversioned aliases, and a floating `clang`/`gcc` conflates releases across
  # runner-image updates regardless (the same reasoning as linux-x64-tsan and
  # the digest jobs above, Laplace findings 7/8). clang-18/clang++-18 are
  # already proven present on this exact runner image by those jobs -- no
  # apt-get step is needed here either.
  branch-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build with source-coverage instrumentation
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate"
          cmake --build build --target superslm_tests
      - name: Run the suite under instrumentation
        run: |
          LLVM_PROFILE_FILE=build/superslm_tests.profraw ./build/superslm_tests
      - name: Merge the raw profile
        run: |
          llvm-profdata-18 merge -sparse build/superslm_tests.profraw -o build/superslm_tests.profdata
      - name: Export per-file branch coverage
        run: |
          llvm-cov-18 export --format=text \
            -instr-profile=build/superslm_tests.profdata \
            ./build/superslm_tests \
            -- src/*.cpp include/superslm/*.h \
            > build/coverage.json
      - name: Check per-file branch-coverage floors
        run: python3 tools/ci/check_branch_coverage_floors.py build/coverage.json

  # The golden headers under tests/ and tools/ state, in their own generated
  # comments, that re-running their generator reproduces them byte-for-byte.
  # This job makes that claim structural rather than asserted: it regenerates
  # every generator that can run on a bare CI runner and fails if the working
  # tree changes, which also re-fires each generator's own guards (the ASCII
  # assertion, the pinned UTF-8 encoding, and the matmul golden's int32-escape
  # reconciliation) on every push and PR instead of only when a developer
  # happens to run the script locally.
  #
  # tests/gen_intmath_fixtures.py and tests/gen_matmul_fixtures.py import their
  # pinned reference from tests/reference/superslm_spike/, vendored in-repo at
  # a content-addressed revision (tests/reference/PROVENANCE.md) rather than
  # from a path outside this repository -- both now run on a bare checkout
  # with no access to any sibling repository (S-HARDEN-5, F3). The provenance
  # check runs first, so a tampered or stale vendor tree fails before either
  # regeneration step runs.
  #
  # tools/unicode_tables_golden.py (S-HARDEN-5, F8) is Unicode.build()'s first
  # committed golden: it asserts the pinned unicodedata version before any
  # table-building loop runs, then hashes the exact UNI1 blob bytes
  # convert_tokenizer.py embeds into every converted model. That assertion is
  # why this job's Python is pinned to the exact version below rather than a
  # floating one, the same reason converter-validate already pins it (T-406).
  generators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install numpy
      - run: python tests/reference/check_provenance.py
      # M1 fold (S-HARDEN-5): total AST ban on the `**` operator in the two
      # generators below, run BEFORE either regenerates -- `**` compiles to a
      # libm pow() call for a float operand, which is exactly what "no
      # sin/cos/log/exp/pow call executes on the regeneration path" must mean
      # if it is to be true (Claude/Vitruvius/SuperSLM_SHARDEN678_Bundle_
      # Design-2026-07-23.md Sec5).
      - run: python tests/check_no_pow_operator.py
      - run: python tests/gen_intmath_fixtures.py
      - run: python tests/gen_matmul_fixtures.py
      - run: python tools/gen_matmul_golden.py
      - run: python tools/gen_silu_lut_golden.py
      # Imports nothing outside the standard library, so it runs on a bare
      # checkout regardless of the reference-vendoring above. Resolves its
      # output path from __file__, so the cwd does not matter.
      - run: python tests/gen_iexp_domain_fixtures.py
      - run: python tools/unicode_tables_golden.py
      - name: Fail if regenerating changed any tracked file
        run: git diff --exit-code -- tests/sslm_intmath_fixtures.h tests/sslm_matmul_fixtures.h tests/matmul_golden_pin.h tests/silu_lut_golden_table.h include/superslm/silu_lut_canonical.h tests/sslm_iexp_domain_fixtures.h tools/unicode_tables_golden.txt

  # S-HARDEN-7 (F5, design Sec3.1, T-411): the "throws only std::bad_alloc"
  # contract's `membership-check` job. Mechanically, on every run: derives the
  # eighteen-site population from the nine include/superslm/*.h headers via a
  # Clang AST walk (tests/ci/derive_bad_alloc_membership.py's corrected,
  # four-condition rule), confirms it matches the pinned oracle
  # (tests/ci/bad_alloc_membership_expected.txt) under three independent scan
  # strategies and the injected-19th-function vitality proof
  # (tests/ci/test_membership_check_population.py), then runs the production
  # gate itself (tools/ci/check_bad_alloc_contract.py --list-unwrapped),
  # which fails naming any derived member whose .cpp definition does not
  # match the shared wrap-helper's rename-and-wrap shape. A Clang capable of
  # `-Xclang -ast-dump=json` ships pre-installed on GitHub's stock
  # `ubuntu-latest` runner image per its published software manifest
  # (design Sec3.1's independence note) -- not reconfirmed by executing a
  # runner in this design pass; this job's own first run is that
  # confirmation.
  bad-alloc-membership-check:
    runs-on: ubuntu-latest
    # Pinned to Clang 18 (matching linux-x64-tsan and the digest jobs above,
    # Laplace findings 7/8): tests/ci/derive_bad_alloc_membership.py invokes
    # `clang++ -Xclang -ast-dump=json` via the SUPERSLM_CLANGXX env var
    # (default bare "clang++" for local use); a floating `clang++` on this job
    # would conflate releases across runner-image updates the same as an
    # unpinned CC/CXX would.
    env:
      SUPERSLM_CLANGXX: clang++-18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest
      - name: Population-validation and vitality tests
        run: python -m pytest tests/ci/ -v
      - name: Fail on any unwrapped member of the derived population
        run: python tools/ci/check_bad_alloc_contract.py --list-unwrapped

  # SuperSLM_S3a_WalkingSkeleton_Plan.md Sec7.3 (T-200, Sec17.3 cell 5; ac34677
  # C1): the checked chain funnel's structural half -- no translation unit in
  # the forward composition may name a funnel leaf (MaxAbsReduce,
  # MaxAbsReduceWide, RowBoundsWide, NormalizeScale, DynamicScaleReciprocal,
  # RequantTokenCode, RequantTokenCodeWide, NarrowAccumulatorToI32) directly,
  # outside the funnel's own file and the leaf certification TUs. Mirrors the
  # two precedents already CI-wired (tests/check_no_pow_operator.py above,
  # tools/ci/check_bad_alloc_contract.py's own job): a test step, then the
  # gate's own explicit `- run:` step. Independent of the bad-alloc-membership-
  # check job above (which also collects tests/ci/ via pytest) so this gate's
  # own pass/fail does not depend on that job's environment or ordering.
  forward-leaf-check:
    runs-on: ubuntu-latest
    # T-1381 (D-SLM464; SuperSLM_S3a_WalkingSkeleton_Plan.md Sec7.3a): the
    # door-count guard (find_leaf_forwarding_doors/check_door_count) is now a
    # Clang-AST derivation over the funnel's one file, replacing the text
    # scanner a second hardened repair still left with three missed shapes.
    # Pinned to Clang 18, matching bad-alloc-membership-check's own job's
    # pin -- a floating `clang++` on this job would conflate releases across
    # runner-image updates the same as an unpinned CC/CXX would. (Corrected
    # 2026-07-31, Poirot 5eff945-t1380-t1381-t1382-review-2026-07-31.md,
    # Minor 3: this comment previously said the sibling job's pin "already
    # proves clang++-18 is present on this exact ubuntu-latest runner image"
    # -- false on two counts. First, that job's own comment above states the
    # opposite: the binary's presence is taken from the published software
    # manifest, "not reconfirmed by executing a runner in this design pass."
    # Second, this job -- added after the last successful run -- has never
    # started on this repository (`gh run view`, executed; T-1450 corrects
    # D-SLM469's broader claim: 77 runs total, 44 successful, last success
    # 2026-07-23T19:03:55Z on 4071828 -- every job added after that commit,
    # this one included, has never started; every push since aborts on the
    # account's Actions spending limit). The underlying fact (clang++-18
    # ships on this runner image per its manifest) is still the true basis
    # for the pin; what was false is the claim that a run had confirmed it.
    # This job's own first successful run is that confirmation, exactly as
    # bad-alloc-membership-check's own comment already states for itself.)
    # The whole-tree leaf ban (scan_files) needs no compiler at all and is
    # unaffected.
    env:
      SUPERSLM_CLANGXX: clang++-18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest
      - name: Forward-leaf check's own red suite
        run: python -m pytest tests/ci/test_check_no_forward_leaf_calls.py -v
      - name: Fail the build if a forward TU names a funnel leaf directly
        run: python tests/ci/check_no_forward_leaf_calls.py

  # SuperSLM_S3a_WalkingSkeleton_Plan.md Sec11 intro, Sec14.12 (D-SLM411, D-SLM414,
  # D-SLM418; board T-1337): a test-suite comment that cites a review-severity
  # finding (Critical N / Significant N / Weak N / Structural N) must also show a
  # resolution marker ("closed", or a cited ticket ID) in the same comment block --
  # the class that recurred seven times across three review rounds before this
  # check existed. Mirrors forward-leaf-check's own two-step shape (self-test,
  # then the gate script) with one difference: the gate step here is NOT wired to
  # fail the build yet. A real-tree run during this check's own build (Claude/
  # Brunel/present-tense-defect-comment-check-2026-07-29.md) found several sites
  # beyond the seven this check was validated against -- at least one, and
  # possibly several more, look like genuine additional instances of the same
  # class, and several others look like backreference-only citations (a debug
  # print or failure-message tag pointing at an already-resolved finding
  # described in full elsewhere) that this check's lexical rule cannot tell
  # apart from a fresh claim. Turning this into a hard gate before those sites
  # are triaged would fail CI immediately over content outside this check-
  # building pass's writable scope (tests/test_main.cpp and the generator under
  # tests/ are not this pass's to edit). `continue-on-error: true` keeps the
  # signal visible in every run's log without blocking merges until that
  # triage happens and this step is promoted to blocking.
  present-tense-defect-comment-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest
      - name: Present-tense-defect-comment check's own red suite and historical-population validation
        run: python -m pytest tests/ci/test_check_present_tense_defect_comments.py -v
      - name: Report present-tense defect citations lacking a resolution marker (advisory, not yet blocking)
        continue-on-error: true
        run: python tests/ci/check_present_tense_defect_comments.py

  # S-HARDEN-3 (F13): the converter's validate/serialize/verify transaction and
  # its proof manifest. Builds `sslm_verify` (the §13 item 7 independent C++
  # verifier) so tools/test_sslm_convert_loader_join.py (§17.3 cell 2) and
  # tools/test_pinned_calibration_gate.py (the "small pinned calibrated
  # fixture" gate) can invoke the REAL compiled binary, not a stand-in --
  # every other module under tools/ is import-independent of the cross-tree
  # spike (see sslm_convert_validate.py's own module docstring) and runs on
  # this bare checkout with no calibrated checkpoint.
  converter-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to 3.13, not the floating '3.x' every other job uses: CPython's
      # bundled unicodedata.unidata_version tracks the minor version
      # (confirmed by inspection: 3.9 -> 13.0.0, 3.11 -> 14.0.0, 3.13 -> 15.1.0),
      # and tools/sslm_convert_validate.py's check_unicode_version_coherence
      # rejects the converter's CFG1 pin (PINNED_UNICODE_VERSION = (15, 1, 0),
      # matching tools/convert_model.py's and tools/unicode_tables.py's own
      # pin) unless the running interpreter's unicodedata agrees exactly. A
      # floating '3.x' resolves to whatever is newest on the runner, which
      # drifted to a Python whose unicodedata is 16.0.0 and failed the gate
      # (UnicodeVersionMismatch) even though the converter's rejection was
      # correct behavior, not a converter defect.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install numpy pytest
      # T-407: assert the Python<->Unicode coupling the comment above only documents, at setup,
      # so a runner drift fails loud HERE instead of deep inside the pytest run as an opaque
      # UnicodeVersionMismatch. Compares the running interpreter against the single pinned source
      # of truth (PINNED_UNICODE_VERSION), never a second copy of the version literal.
      - name: Assert running unicodedata matches PINNED_UNICODE_VERSION
        run: |
          python -c "import sys; sys.path.insert(0, 'tools'); import unicodedata; from sslm_convert_validate import PINNED_UNICODE_VERSION as P; a = tuple(int(x) for x in unicodedata.unidata_version.split('.')); assert a == P, f'unicodedata {a} != pinned {P}'"
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --target sslm_verify
      # tests/reference/ added for S-HARDEN-5: its guard-vitality suite
      # (tests/reference/test_check_provenance.py) proves check_provenance.py
      # actually rejects a tampered vendored file, not merely that a clean
      # tree passes. Import-independent of the cross-tree spike, same as
      # everything else this job already runs.
      - run: python -m pytest tools/ tests/reference/ -v
